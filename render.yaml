services:
  - type: web
    name: omniroute-chat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OMNIROUTE_BASE_URL
        value: http://localhost:20128/v1
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_MODEL
        value: auto/best-chat
