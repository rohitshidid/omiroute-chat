services:
  - type: web
    name: omniroute-chat
    runtime: python
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OMNIROUTE_BASE_URL
        value: http://127.0.0.1:20128/v1
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_MODEL
        value: auto/best-chat
