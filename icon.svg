<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Rounded Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle Inset Rim Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" />

  <!-- Glowing Lightning Bolt / Routing Mark -->
  <path d="M 288 80 L 160 272 L 256 272 L 224 432 L 352 240 L 256 240 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)" />
</svg>
