<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Indigo Squircle Background -->
    <linearGradient id="bl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="45%" stop-color="#0e1426" />
      <stop offset="100%" stop-color="#1b1538" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="bl_ambient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Inset Rim Stroke -->
    <linearGradient id="bl_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.22" />
    </linearGradient>

    <!-- Left Hemisphere Conduits (Cyan to Indigo) -->
    <linearGradient id="bl_leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Right Hemisphere Conduits (Violet to Magenta) -->
    <linearGradient id="bl_rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Central Routing Gateway Beam -->
    <linearGradient id="bl_centerBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Unclipped Glow Filters -->
    <filter id="bl_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bl_coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Apple Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bl_bg)" />
  <circle cx="256" cy="256" r="220" fill="url(#bl_ambient)" />
  <rect x="4.5" y="4.5" width="503" height="503" rx="113.5" fill="none" stroke="url(#bl_rim)" stroke-width="4.5" />

  <!-- Outer Orbit Segment Guides (The Omni Ring) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="4 16" />

  <!-- ==================== LEFT HEMISPHERE (ANATOMICAL BRAIN FOLDS) ==================== -->
  <!-- Top Frontal Lobe Arc -->
  <path d="M 236 108 C 175 108, 118 150, 118 215 C 118 245, 134 268, 142 288"
        fill="none" stroke="url(#bl_leftGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Mid Parietal/Temporal Convolution -->
  <path d="M 124 235 C 155 210, 205 210, 236 235"
        fill="none" stroke="url(#bl_leftGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Inner Frontal Sulcus Loop -->
  <path d="M 236 170 C 185 170, 155 195, 175 240 C 190 270, 220 270, 236 295"
        fill="none" stroke="url(#bl_leftGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Lower Occipital / Cerebellum Route -->
  <path d="M 148 290 C 120 325, 135 385, 185 398 C 220 405, 236 375, 236 345"
        fill="none" stroke="url(#bl_leftGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Lower Inner Cerebellar Fold -->
  <path d="M 175 350 C 195 330, 220 335, 236 350"
        fill="none" stroke="url(#bl_leftGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- ==================== RIGHT HEMISPHERE (ANATOMICAL BRAIN FOLDS) ==================== -->
  <!-- Top Frontal Lobe Arc -->
  <path d="M 276 108 C 337 108, 394 150, 394 215 C 394 245, 378 268, 370 288"
        fill="none" stroke="url(#bl_rightGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Mid Parietal/Temporal Convolution -->
  <path d="M 388 235 C 357 210, 307 210, 276 235"
        fill="none" stroke="url(#bl_rightGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Inner Frontal Sulcus Loop -->
  <path d="M 276 170 C 327 170, 357 195, 337 240 C 322 270, 292 270, 276 295"
        fill="none" stroke="url(#bl_rightGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Lower Occipital / Cerebellum Route -->
  <path d="M 364 290 C 392 325, 377 385, 327 398 C 292 405, 276 375, 276 345"
        fill="none" stroke="url(#bl_rightGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Lower Inner Cerebellar Fold -->
  <path d="M 337 350 C 317 330, 292 335, 276 350"
        fill="none" stroke="url(#bl_rightGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- ==================== CENTRAL ROUTING TRUNK & SYNAPSE CORE ==================== -->
  <!-- Central Fissure Highway Beam -->
  <line x1="256" y1="92" x2="256" y2="415" stroke="url(#bl_centerBeam)" stroke-width="12" stroke-linecap="round" filter="url(#bl_glow)" />

  <!-- Synaptic Relay Nodes -->
  <circle cx="236" cy="108" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3" filter="url(#bl_glow)" />
  <circle cx="276" cy="108" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="3" filter="url(#bl_glow)" />
  <circle cx="118" cy="215" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="394" cy="215" r="9" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="185" cy="398" r="10" fill="#6366f1" stroke="#ffffff" stroke-width="3" />
  <circle cx="327" cy="398" r="10" fill="#e879f9" stroke="#ffffff" stroke-width="3" />

  <circle cx="256" cy="92" r="12" fill="#ffffff" stroke="#38bdf8" stroke-width="3.5" filter="url(#bl_glow)" />
  <circle cx="256" cy="415" r="12" fill="#ffffff" stroke="#e879f9" stroke-width="3.5" filter="url(#bl_glow)" />

  <!-- Central Waypoint Nexus Spark (Corpus Callosum Core) -->
  <g transform="translate(256, 256)" filter="url(#bl_coreGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="6" fill="#6366f1" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>